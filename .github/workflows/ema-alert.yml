# A placer dans le depot sous : .github/workflows/ema-alert.yml
name: EMA Cross Alert

on:
  schedule:
    - cron: "*/5 * * * *"    # toutes les 5 min, aligne sur INTERVAL=5m
  workflow_dispatch:          # permet de lancer le check manuellement depuis GitHub

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessaire pour committer state.json (evite les alertes en double)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Verifier le croisement EMA sur tous les symboles
        run: python ema_alert.py
        env:
          SYMBOLS: "BTC-USD,ETH-USD,EURUSD=X,GBPUSD=X,AAPL,^GSPC"   # melange crypto / forex / actions / indices
          INTERVAL: "5m"
          PERIOD: "5d"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Sauvegarder l'etat (anti doublons)
        run: |
          git config user.name "ema-bot"
          git config user.email "ema-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update state"
          git push
