name: Pro Trading Analysis Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Exécuter l'analyse de trading professionnelle
        run: python ema_alert.py
        env:
          SYMBOLS_CONFIG: '{"BTC-USD":{"interval":"15m","period":"60d","ema_fast":9,"ema_slow":21,"ema_trend":200,"rsi_period":14,"min_score":60},"ETH-USD":{"interval":"15m","period":"60d","ema_fast":9,"ema_slow":21,"ema_trend":200,"rsi_period":14,"min_score":60},"EURUSD=X":{"interval":"15m","period":"60d","ema_fast":9,"ema_slow":21,"ema_trend":200,"rsi_period":14,"min_score":60},"GBPUSD=X":{"interval":"15m","period":"60d","ema_fast":9,"ema_slow":21,"ema_trend":200,"rsi_period":14,"min_score":60},"USDJPY=X":{"interval":"15m","period":"60d","ema_fast":9,"ema_slow":21,"ema_trend":200,"rsi_period":14,"min_score":60},"AUDUSD=X":{"interval":"15m","period":"60d","ema_fast":9,"ema_slow":21,"ema_trend":200,"rsi_period":14,"min_score":60},"USDCAD=X":{"interval":"15m","period":"60d","ema_fast":9,"ema_slow":21,"ema_trend":200,"rsi_period":14,"min_score":60},"USDCHF=X":{"interval":"15m","period":"60d","ema_fast":9,"ema_slow":21,"ema_trend":200,"rsi_period":14,"min_score":60},"AAPL":{"interval":"15m","period":"60d","ema_fast":20,"ema_slow":50,"ema_trend":200,"rsi_period":14,"min_score":60},"^GSPC":{"interval":"1h","period":"180d","ema_fast":20,"ema_slow":50,"ema_trend":200,"rsi_period":14,"min_score":60}}'
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Sauvegarder l'état (anti-doublons)
        run: |
          git config user.name "nytradealert-bot"
          git config user.email "bot@nytradealert.com"
          git add state.json
          git diff --staged --quiet || git commit -m "update state"
          git push
